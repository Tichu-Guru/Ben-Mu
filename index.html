<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ben Mü</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0eee8;
  --surface: #faf9f5;
  --surface2: #f0ede4;
  --surface3: #e8e3d8;
  --gold: #7a5a10;
  --gold-light: #a07820;
  --gold-dim: #b89840;
  --cream: #1a1408;
  --cream-dim: #4a4030;
  --red: #b02010;
  --red-light: #c83020;
  --green: #1a6a38;
  --green-light: #2a8a50;
  --text: #1a1408;
  --text-dim: #6a6050;
  --border: #d0c8b0;
  --border-gold: #c0a850;

  /* Suit colors */
  --cups: #3a7fd4;
  --swords: #c8a800;
  --staffs: #d43a2a;
  --coins: #2a9a50;
  --moon: #7060a8;
  --sun: #d4720a;

  --card-w: 62px;
  --card-h: 92px;
  --strip-w: 20px;
  --radius: 6px;
}

@media (max-width: 480px) {
  :root {
    --card-w: 52px;
    --card-h: 78px;
    --strip-w: 17px;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Crimson Pro', serif;
  font-size: 16px;
  min-height: 100vh;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(180,160,100,0.08) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(176,32,16,0.05) 0%, transparent 50%);
}

/* ── SCREENS ── */
.screen { display: none; width: 100%; min-height: 100vh; }
.screen.active { display: flex; flex-direction: column; }

/* ── SETUP SCREEN ── */
#screen-setup {
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
.title-block { text-align: center; margin-bottom: 48px; }
.title-block h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(2rem, 6vw, 3.5rem);
  color: var(--gold);
  letter-spacing: 0.08em;
  text-shadow: 0 2px 8px rgba(120,90,16,0.15);
}
.title-block .subtitle {
  font-size: 1.1rem;
  color: var(--cream-dim);
  font-style: italic;
  margin-top: 8px;
  letter-spacing: 0.1em;
}
.setup-card {
  background: var(--surface);
  border: 1px solid var(--border-gold);
  border-radius: 12px;
  padding: 36px 40px;
  width: 100%;
  max-width: 480px;
}
.setup-card h2 {
  font-family: 'Cinzel Decorative', serif;
  font-size: 1rem;
  color: var(--gold-dim);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 24px;
}
.form-group { margin-bottom: 20px; }
.form-group label {
  display: block;
  font-size: 0.85rem;
  color: var(--cream-dim);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.form-group input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--cream);
  font-family: 'Crimson Pro', serif;
  font-size: 1.1rem;
  padding: 10px 14px;
  outline: none;
  transition: border-color 0.2s;
}
.form-group input:focus { border-color: var(--gold-dim); }
.player-count-group { display: flex; gap: 8px; }
.count-btn {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--cream-dim);
  font-family: 'Crimson Pro', serif;
  font-size: 1.2rem;
  padding: 10px;
  cursor: pointer;
  transition: all 0.2s;
}
.count-btn:hover { border-color: var(--gold-dim); color: var(--cream); }
.count-btn.selected { background: var(--surface3); border-color: var(--gold); color: var(--gold); }
.btn-primary {
  width: 100%;
  background: linear-gradient(135deg, #5a3a08, #8a5a14, #5a3a08);
  border: none;
  border-radius: 8px;
  color: #faf5e8;
  font-family: 'Cinzel Decorative', serif;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  padding: 14px;
  cursor: pointer;
  margin-top: 8px;
  transition: all 0.2s;
  text-transform: uppercase;
}
.btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }

/* ── GAME SCREEN ── */
#screen-game {
  flex-direction: column;
  min-height: 100vh;
}
.game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border-gold);
  position: sticky;
  top: 0;
  z-index: 20;
  flex-wrap: wrap;
  gap: 4px;
}
.game-header .logo {
  font-family: 'Cinzel Decorative', serif;
  font-size: 0.85rem;
  color: var(--gold);
  letter-spacing: 0.08em;
}
.game-header .phase-label {
  font-size: 0.75rem;
  color: var(--cream-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.vp-scoreboard {
  display: flex;
  gap: 8px;
  font-size: 0.75rem;
  flex-wrap: wrap;
}
.vp-entry { color: var(--cream-dim); }
.vp-entry span { color: var(--gold); font-weight: 600; }

.game-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ── OPPONENTS AREA ── */
.opponents-row {
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 8px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.opponent-zone {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  flex: 1;
  min-width: 80px;
  border-radius: 8px;
  padding: 6px 4px;
  border: 2px solid transparent;
  transition: border-color 0.3s;
}
.opponent-zone.team-chief { border-color: #1a6acc; background: rgba(26,106,204,0.06); }
.opponent-zone.team-vice  { border-color: #cc1a1a; background: rgba(204,26,26,0.06); }
.opponent-name {
  font-size: 0.7rem;
  color: var(--cream-dim);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.opponent-name.chief { color: var(--gold); }
.opponent-name.vice { color: var(--red-light); }
.opponent-name.partner { color: var(--green-light); }
.opponent-hand-count {
  font-size: 0.65rem;
  color: var(--text-dim);
}
.opponent-tableau {
  display: flex;
  gap: 3px;
  flex-wrap: wrap;
  justify-content: center;
}

/* ── CENTER PLAY AREA ── */
.center-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px;
  position: relative;
  min-height: 160px;
}

.trick-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 100%;
  max-width: 500px;
}

.trick-label {
  font-size: 0.75rem;
  color: var(--cream-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.trick-cards {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  min-height: 100px;
  align-items: center;
}

.trick-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.trick-slot .player-tag {
  font-size: 0.65rem;
  color: var(--text-dim);
  text-align: center;
  max-width: 70px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── INFO PANEL ── */
.info-panel {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 16px;
  text-align: center;
  max-width: 500px;
  width: 100%;
}
.info-panel .info-title {
  font-size: 0.75rem;
  color: var(--gold-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.info-panel .info-text {
  font-size: 1rem;
  color: var(--cream);
  font-style: italic;
}
.trump-display {
  display: flex;
  gap: 16px;
  justify-content: center;
  font-size: 0.85rem;
  margin-top: 6px;
}
.trump-badge {
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.05em;
}
.trump-badge.major { background: rgba(122,90,16,0.12); color: var(--gold); border: 1px solid var(--gold-dim); }
.trump-badge.minor { background: rgba(176,32,16,0.1); color: var(--red-light); border: 1px solid var(--red); }
.trump-badge.none { background: rgba(180,160,100,0.15); color: var(--text-dim); border: 1px solid var(--border); }

/* ── PLAYER AREA ── */
.player-area {
  background: var(--surface);
  border-top: 4px solid transparent;
  padding: 10px 12px 20px;
  transition: border-color 0.3s;
}
.player-area.team-chief { border-top-color: #1a6acc; }
.player-area.team-vice  { border-top-color: #cc1a1a; }
.player-info-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.player-role-label {
  font-size: 0.8rem;
  font-style: italic;
  color: var(--cream-dim);
}
.player-role-label.chief { color: var(--gold); }
.player-role-label.vice { color: var(--red-light); }
.player-role-label.partner { color: var(--green-light); }
.hand-label {
  font-size: 0.7rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.hand-row {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 8px;
}

.tableau-row {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 8px;
  min-height: calc(var(--card-h) + 2px);
  padding: 4px 0;
}

/* ── CARDS ── */
.card {
  width: var(--card-w);
  height: var(--card-h);
  border-radius: var(--radius);
  border: 1px solid rgba(0,0,0,0.15);
  display: flex;
  flex-direction: row;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
  user-select: none;
}
.card:hover { transform: translateY(-6px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
.card.selected { transform: translateY(-10px); box-shadow: 0 10px 24px rgba(122,90,16,0.3); border-color: var(--gold); }
.card.disabled { opacity: 0.4; cursor: not-allowed; }
.card.disabled:hover { transform: none; }
.card.in-trick { transform: none; cursor: default; }
.card.in-trick:hover { transform: none; }

.card-strip {
  width: var(--strip-w);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 3px 2px;
  flex-shrink: 0;
  font-size: 0.6rem;
  font-weight: 700;
}
.card-strip .strip-rank { font-size: 0.65rem; line-height: 1; }
.card-strip .strip-icon { font-size: 0.7rem; line-height: 1; }
.card-strip .strip-vp { font-size: 0.5rem; line-height: 1; opacity: 0.9; }

.card-face {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 4px 2px;
}
.card-face .face-rank {
  font-family: 'Cinzel Decorative', serif;
  font-size: 1rem;
  line-height: 1;
  font-weight: 700;
}
.card-face .face-icon { font-size: 1.1rem; line-height: 1; }
.card-face .face-vp {
  font-size: 0.55rem;
  opacity: 0.8;
  text-align: center;
}

/* Joker rainbow strip */
.card-strip.joker {
  background: linear-gradient(180deg, #e74c3c, #e67e22, #f1c40f, #2ecc71, #3498db, #9b59b6);
}

/* Card back (for AI hands) */
.card-back {
  width: var(--card-w);
  height: var(--card-h);
  border-radius: var(--radius);
  border: 1px solid var(--border-gold);
  background: linear-gradient(135deg, var(--surface2) 0%, var(--surface3) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 1rem;
  color: var(--gold-dim);
}

/* Mini card for tableau */
.card-mini {
  width: 28px;
  height: 44px;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.08);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 2px;
  font-size: 0.5rem;
  font-weight: 700;
  cursor: default;
  flex-shrink: 0;
}

/* ── ACTION BUTTONS ── */
.action-row {
  display: flex;
  gap: 8px;
  justify-content: center;
  padding: 8px 0 0;
  flex-wrap: wrap;
}
.btn-action {
  background: var(--surface3);
  border: 1px solid var(--border-gold);
  border-radius: 6px;
  color: var(--gold);
  font-family: 'Crimson Pro', serif;
  font-size: 0.9rem;
  letter-spacing: 0.05em;
  padding: 8px 18px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-action:hover { background: var(--surface2); border-color: var(--gold); }
.btn-action.danger { color: var(--red-light); border-color: var(--red); }
.btn-action.danger:hover { background: rgba(192,57,43,0.15); }
.btn-action.confirm { color: var(--green-light); border-color: var(--green); }
.btn-action.confirm:hover { background: rgba(42,122,74,0.2); }
.btn-action:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-action:disabled:hover { background: var(--surface3); border-color: var(--border-gold); }

/* ── MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border-gold);
  border-radius: 12px;
  padding: 28px 32px;
  max-width: 480px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
}
.modal h3 {
  font-family: 'Cinzel Decorative', serif;
  font-size: 1rem;
  color: var(--gold);
  letter-spacing: 0.08em;
  margin-bottom: 16px;
}
.modal p { color: var(--cream-dim); font-size: 0.95rem; margin-bottom: 12px; line-height: 1.6; }
.modal-options { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.modal-option {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--cream);
  font-family: 'Crimson Pro', serif;
  font-size: 1rem;
  padding: 10px 14px;
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
}
.modal-option:hover { border-color: var(--gold-dim); color: var(--gold); background: var(--surface2); }
.modal-option.selected { border-color: var(--gold); background: var(--surface3); color: var(--gold); }

/* ── SCORING OVERLAY ── */
.scoring-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.9rem; }
.scoring-table th { color: var(--gold-dim); font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.75rem; padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; }
.scoring-table td { padding: 6px 8px; border-bottom: 1px solid var(--surface2); color: var(--cream); }
.scoring-table .positive { color: var(--green-light); }
.scoring-table .negative { color: var(--red-light); }
.scoring-table .bonus { color: var(--gold); font-weight: 600; }

/* ── LOG ── */
.game-log {
  position: fixed;
  bottom: 200px;
  right: 12px;
  width: 220px;
  max-height: 120px;
  overflow-y: auto;
  background: rgba(13,11,8,0.9);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 0.7rem;
  color: var(--text-dim);
  z-index: 10;
  display: none;
}
.log-entry { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
.log-entry.important { color: var(--gold-dim); }

/* ── UTILITY ── */
.gold { color: var(--gold); }
.red { color: var(--red-light); }
.green { color: var(--green-light); }
.dim { color: var(--text-dim); }
.center { text-align: center; }
.mt8 { margin-top: 8px; }
.mt16 { margin-top: 16px; }
.divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

.player-slot {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.player-slot .slot-label {
  font-size: 0.8rem;
  color: var(--text-dim);
  width: 60px;
  flex-shrink: 0;
}
.slot-type-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-dim);
  font-family: 'Crimson Pro', serif;
  font-size: 0.85rem;
  padding: 5px 10px;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.2s;
}
.slot-type-btn.human {
  border-color: var(--green);
  color: var(--green-light);
  background: rgba(26,106,56,0.1);
}
.slot-name-input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--cream);
  font-family: 'Crimson Pro', serif;
  font-size: 0.95rem;
  padding: 5px 10px;
  outline: none;
  transition: border-color 0.2s;
}
.slot-name-input:focus { border-color: var(--gold-dim); }
.slot-name-input:disabled { opacity: 0.4; }
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="screen-setup" class="screen active">
  <div class="title-block">
    <h1>Ben Mü</h1>
    <div class="subtitle">A BZF Trick-Taking Game</div>
  </div>
  <div class="setup-card">
    <h2>New Game</h2>
    <div class="form-group">
      <label>Your Name</label>
      <input type="text" id="player-name-input" value="Ben" maxlength="16">
    </div>
    <div class="form-group">
      <label>Number of Players</label>
      <div class="player-count-group" id="count-btns">
        <button class="count-btn" data-n="3">3</button>
        <button class="count-btn selected" data-n="4">4</button>
        <button class="count-btn" data-n="5">5</button>
        <button class="count-btn" data-n="6">6</button>
      </div>
    </div>
    <div class="form-group">
      <label>Win Target</label>
      <div class="player-count-group">
        <button class="count-btn selected" data-target="300" id="t300">300 VP</button>
        <button class="count-btn" data-target="500" id="t500">500 VP</button>
      </div>
    </div>
    <div class="form-group" id="player-slots-group">
      <label>Player Slots</label>
      <div id="player-slots"></div>
    </div>
    <button class="btn-primary" id="start-btn">Begin the Round</button>
    <div style="margin-top:14px;display:flex;flex-direction:column;gap:8px;align-items:center;">
      <label style="font-size:0.8rem;color:var(--text-dim);cursor:pointer;display:inline-flex;align-items:center;gap:8px;">
        <input type="checkbox" id="use-ma" style="width:14px;height:14px;cursor:pointer;">
        ✦ Major Arcana expansion
      </label>
      <label style="font-size:0.8rem;color:var(--text-dim);cursor:pointer;display:inline-flex;align-items:center;gap:8px;">
        <input type="checkbox" id="cheat-jokers" style="width:14px;height:14px;cursor:pointer;">
        🃏 Debug: deal me all Jokers
      </label>
    </div>
  </div>
</div>

<!-- MA AUCTION SCREEN -->
<div id="ma-auction-screen" style="display:none;position:fixed;inset:0;z-index:500;background:var(--bg);flex-direction:column;align-items:center;padding:20px 16px;gap:12px;overflow-y:auto;">
  <div style="font-family:'Cinzel Decorative',serif;font-size:1rem;color:#9040c0;letter-spacing:0.1em;">✦ Major Arcana Auction ✦</div>
  <div id="ma-auction-sub" style="font-size:0.85rem;color:var(--text-dim);text-align:center;max-width:480px;"></div>
  <div id="ma-auction-cards" style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;max-width:580px;"></div>
  <div id="ma-auction-detail" style="display:none;background:var(--surface);border:1px solid #9040c0;border-radius:8px;padding:12px 16px;max-width:380px;width:100%;">
    <div id="ma-auction-detail-name" style="font-family:'Cinzel Decorative',serif;font-size:0.85rem;color:#9040c0;margin-bottom:6px;"></div>
    <div id="ma-auction-detail-desc" style="font-size:0.9rem;color:var(--text);line-height:1.5;"></div>

<script>
// ═══════════════════════════════════════════════

const MA_POOL = [

  { id:'Pan',        n:15, copies:1, label:'Pan',              timing:'PreDeal',
    desc:'After team assignment: form a special team with any non-lead player. Target receives +25↑.' },
  { id:'Tower',      n:16, copies:1, label:'The Tower',        timing:'DuringTrick',
    desc:'Kn, Q, and K cards in this trick lose 7 ranks for resolution purposes.' },
  { id:'Star',       n:17, copies:1, label:'The Star',         timing:'DuringTrick',
    desc:'All ★ Star VP scored in this trick is doubled.' },
  { id:'Moon',       n:18, copies:1, label:'The Moon',         timing:'DuringTrick',

  { id:'Sun',        n:19, copies:1, label:'The Sun',          timing:'DuringTrick',

  { id:'World',      n:21, copies:1, label:'The World',        timing:'DuringTrick',
    desc:'+6↑ per distinct suit represented in this trick, awarded to the trick winner.' },
